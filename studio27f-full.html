<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO 27F | Game Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --gradient: linear-gradient(90deg, #FF4D4D, #FF8C42, #FFD93D);
            --bg: #ffffff; --text: #111111; --gray: #666666;
            --card-bg: #ffffff; --border: #eeeeee;
            --header-bg: rgba(255,255,255,0.92); --footer-bg: #111111; --footer-text: #aaaaaa;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f0f0f; --text: #f0f0f0; --gray: #aaaaaa;
                --card-bg: #1a1a1a; --border: #333333;
                --header-bg: rgba(15,15,15,0.92); --footer-bg: #000000; --footer-text: #888888;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        header { position: fixed; top: 0; width: 100%; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); backdrop-filter: blur(12px); z-index: 1000; border-bottom: 1px solid var(--border); }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-container img { height: 40px; }
        .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1.3rem; }
        nav a { margin-left: 2rem; text-decoration: none; color: var(--text); font-weight: 500; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 120px 5% 80px; position: relative; }
        .hero::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,77,77,0.08) 0%, transparent 70%); z-index: -1; }
        .hero-logo { max-width: 380px; width: 90%; margin-bottom: 2rem; filter: drop-shadow(0 10px 30px rgba(255,77,77,0.18)); }
        .hero h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 700; margin-bottom: 1rem; }
        .gradient-text { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hero p { font-size: 1.2rem; color: var(--gray); max-width: 620px; margin: 0 auto 2.5rem; }
        .btn { display: inline-block; padding: 14px 32px; background: var(--gradient); color: white; text-decoration: none; border-radius: 50px; font-weight: 600; margin: 0 8px; }
        .btn-outline { background: transparent; color: var(--text); border: 2px solid var(--border); }
        .btn-small { padding: 8px 16px; font-size: 0.85rem; margin-top: 0.5rem; }
        section { padding: 80px 5%; }
        .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 2.4rem; text-align: center; margin-bottom: 2.5rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1.5rem; max-width: 900px; margin: 0 auto; }
        .stat-box { text-align: center; padding: 1.5rem; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); }
        .stat-number { font-size: 2.2rem; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; max-width: 1100px; margin: 0 auto; }
        .feature-card { background: var(--card-bg); padding: 1.8rem; border-radius: 16px; border: 1px solid var(--border); text-align: center; }
        .feature-card h3 { margin-bottom: 0.5rem; }
        .feature-card p { color: var(--gray); font-size: 0.95rem; }
        .updates { max-width: 800px; margin: 0 auto; }
        .update-item { background: var(--card-bg); padding: 1.2rem 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1rem; }
        .update-item h4 { margin-bottom: 0.3rem; }
        .update-item small { color: var(--gray); }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--border); position: relative; }
        .game-media { height: 180px; background: #222; overflow: hidden; }
        .placeholder { width: 100%; height: 100%; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; font-weight: 700; }
        .game-info { padding: 1.4rem 1.5rem; }
        .game-info h3 { font-size: 1.35rem; margin-bottom: 0.4rem; }
        .game-info p { color: var(--gray); font-size: 0.95rem; }
        .media-fields { display: none; margin-top: 0.8rem; }
        .edit-mode .media-fields { display: block; }
        .media-fields input { width: 100%; padding: 6px 8px; margin: 4px 0; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 0.85rem; }
        .delete-btn { position: absolute; top: 10px; right: 10px; background: #ff4d4d; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: none; z-index: 10; }
        .edit-mode .delete-btn { display: block; }
        .add-game-btn, .add-update-btn { display: none; margin: 1.5rem auto 0; background: #28a745; }
        .edit-mode .add-game-btn, .edit-mode .add-update-btn { display: inline-block; }
        .social { text-align: center; margin-top: 1.5rem; }
        .social a { margin: 0 10px; color: var(--text); text-decoration: none; font-weight: 500; }
        footer { background: var(--footer-bg); color: var(--footer-text); text-align: center; padding: 3rem 5%; }
        .edit-mode [contenteditable="true"] { outline: 2px dashed #FF8C42; background: rgba(255,140,66,0.1); border-radius: 4px; }
        .edit-mode [contenteditable="true"]:focus { outline: 2px solid #FF4D4D; }
        .edit-toolbar { position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .edit-toolbar button { padding: 14px 22px; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 4px 15px rgba(0,0,0,0.25); }
        #toggle-edit { background: linear-gradient(90deg, #FF4D4D, #FF8C42); color: white; }
        #save-btn { background: #22c55e; color: white; display: none; }
        .edit-mode #save-btn { display: block; }
        .status { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #111; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; z-index: 9999; display: none; }
        @media (max-width: 768px) { nav { display: none; } .edit-toolbar { bottom: 15px; right: 15px; } }
    </style>
</head>

    function setStatus(msg, show = true) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.style.display = show ? 'block' : 'none';
    }

    function loadData() {
        setStatus('กำลังโหลดข้อมูล...');
        db.ref('siteData').once('value').then(snapshot => {
            siteData = snapshot.val() || JSON.parse(JSON.stringify(defaultData));
            if (!snapshot.val()) {
                db.ref('siteData').set(defaultData);
            }
            // Ensure arrays exist
            if (!siteData.stats) siteData.stats = defaultData.stats;
            if (!siteData.features) siteData.features = defaultData.features;
            if (!siteData.updates) siteData.updates = defaultData.updates;
            if (!siteData.social) siteData.social = defaultData.social;
            (siteData.games || []).forEach(g => {
                if (!g.thumb) g.thumb = g.title ? g.title.charAt(0) : "G";
            });
            render();
            setStatus('', false);
        }).catch(err => {
            setStatus('โหลดไม่สำเร็จ: ' + err.message);
            siteData = JSON.parse(JSON.stringify(defaultData));
            render();
        });
    }

    function getYouTubeId(url) {
        if (!url) return null;
        const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?\s]+)/);
        return m ? m[1] : null;
    }

    function saveData() {
        setStatus('กำลังบันทึก...');
        siteData.brandName = document.getElementById('header-brand').textContent.trim();
        const h1 = document.querySelector('#hero h1');
        if (h1) siteData.heroTitle = h1.innerHTML;
        const heroP = document.querySelector('#hero p');
        if (heroP) siteData.heroDesc = heroP.textContent;
        const aboutH2 = document.querySelector('#about h2');
        if (aboutH2) siteData.aboutTitle = aboutH2.innerHTML;
        const aboutPs = document.querySelectorAll('#about p');
        if (aboutPs[0]) siteData.aboutP1 = aboutPs[0].textContent;
        if (aboutPs[1]) siteData.aboutP2 = aboutPs[1].textContent;
        const contactH2 = document.querySelector('#contact h2');
        if (contactH2) siteData.contactTitle = contactH2.textContent;
        const contactP = document.querySelector('#contact p');
        if (contactP) siteData.contactDesc = contactP.textContent;
        const footerP = document.querySelector('#footer p');
        if (footerP) siteData.footerText = footerP.textContent;

        // Stats
        siteData.stats = [];
        document.querySelectorAll('.stat-box').forEach(box => {
            siteData.stats.push({
                number: box.querySelector('.stat-number')?.textContent || "",
                label: box.querySelector('.stat-label')?.textContent || ""
            });
        });

        // Features
        siteData.features = [];
        document.querySelectorAll('.feature-card').forEach(card => {
            siteData.features.push({
                title: card.querySelector('h3')?.textContent || "",
                desc: card.querySelector('p')?.textContent || ""
            });
        });

        // Games
        siteData.games = [];
        document.querySelectorAll('.game-card').forEach(card => {
            const vidInput = card.querySelector('.vid-url');
            const thumbEl = card.querySelector('.placeholder');
            siteData.games.push({
                title: card.querySelector('h3')?.textContent || "เกม",
                description: card.querySelector('.game-desc')?.textContent || "",
                thumb: thumbEl ? thumbEl.textContent.trim() : "G",
                video: vidInput ? vidInput.value.trim() : ""
            });
        });

        // Updates
        siteData.updates = [];
        document.querySelectorAll('.update-item').forEach(item => {
            siteData.updates.push({
                title: item.querySelector('h4')?.textContent || "",
                date: item.querySelector('small')?.textContent || "",
                text: item.querySelector('p')?.textContent || ""
            });
        });

        db.ref('siteData').set(siteData).then(() => {
            setStatus('บันทึกสำเร็จ! ทุกคนจะเห็นข้อมูลใหม่');
            setTimeout(() => setStatus('', false), 3000);
        }).catch(err => {
            setStatus('บันทึกไม่สำเร็จ: ' + err.message);
        });
    }

                ${(siteData.features || []).map(f => `
                    <div class="feature-card">
                        <h3 contenteditable="false">${f.title}</h3>
                        <p contenteditable="false">${f.desc}</p>
                    </div>
                `).join('')}
            </div>`;

        document.getElementById('games').innerHTML = `
            <h2 class="section-title">เกมของเรา</h2>
            <div class="games-grid">
                ${(siteData.games || []).map((game, i) => {
                    const yt = getYouTubeId(game.video);
                    let media = '';
                    let watchBtn = '';
                    if (yt) {
                        media = `<iframe src="https://www.youtube.com/embed/${yt}" style="width:100%;height:100%;border:none;" allowfullscreen></iframe>`;
                        watchBtn = `<a href="https://www.youtube.com/watch?v=${yt}" target="_blank" class="btn btn-small">▶ ดูวิดีโอ</a>`;
                    } else {
                        media = `<div class="placeholder" contenteditable="false">${game.thumb || game.title.charAt(0)}</div>`;
                    }
                    return `
                    <div class="game-card">
                        <button class="delete-btn" onclick="deleteGame(${i})">×</button>
                        <div class="game-media">${media}</div>
                        <div class="game-info">
                            <h3 contenteditable="false">${game.title}</h3>
                            <p class="game-desc" contenteditable="false">${game.description}</p>
                            ${watchBtn}
                            <div class="media-fields">
                                <input class="vid-url" type="text" placeholder="ลิงก์ YouTube" value="${game.video || ''}">
                            </div>
                        </div>
                    </div>`;
                }).join('')}
            </div>
            <button class="btn add-game-btn" onclick="addGame()">+ เพิ่มเกม</button>`;

        document.getElementById('updates').innerHTML = `
            <h2 class="section-title">อัปเดตล่าสุด</h2>
            <div class="updates">
                ${(siteData.updates || []).map((u, i) => `
                    <div class="update-item">
                        <button class="delete-btn" onclick="deleteUpdate(${i})" style="position:absolute;right:10px;top:10px;">×</button>
                        <h4 contenteditable="false">${u.title}</h4>
                        <small contenteditable="false">${u.date}</small>
                        <p contenteditable="false" style="margin-top:0.5rem;">${u.text}</p>
                    </div>
                `).join('')}
            </div>
            <button class="btn add-update-btn" onclick="addUpdate()">+ เพิ่มอัปเดต</button>`;

        document.getElementById('about').innerHTML = `
            <h2 class="section-title" contenteditable="false">${siteData.aboutTitle}</h2>
            <div style="max-width:800px;margin:0 auto;text-align:center;">
                <p contenteditable="false">${siteData.aboutP1}</p><br>
                <p contenteditable="false">${siteData.aboutP2}</p>
            </div>`;

        document.getElementById('contact').innerHTML = `
            <h2 class="section-title" contenteditable="false">${siteData.contactTitle}</h2>
            <div style="max-width:500px;margin:0 auto;text-align:center;">
                <p contenteditable="false" style="color:var(--gray);margin-bottom:1rem;">${siteData.contactDesc}</p>
                <a href="mailto:${siteData.contactEmail}" class="btn">ส่งอีเมล</a>
                <p style="margin-top:0.8rem;color:var(--gray);">${siteData.contactEmail}</p>
                <div class="social">
                    <a href="#" contenteditable="false">YouTube</a>
                    <a href="#" contenteditable="false">Twitter</a>
                    <a href="#" contenteditable="false">Discord</a>
                </div>
            </div>`;

        document.getElementById('footer').innerHTML = `
            <div style="font-size:1.4rem;color:white;margin-bottom:0.5rem;">${siteData.brandName}</div>
            <p contenteditable="false">${siteData.footerText}</p>`;

        updateEditMode();
    }

    function updateEditMode() {
        document.body.classList.toggle('edit-mode', editMode);
        document.querySelectorAll('[contenteditable]').forEach(el => {
            el.contentEditable = editMode ? "true" : "false";
        });
        document.getElementById('toggle-edit').textContent = editMode ? '✕ ปิดโหมดแก้ไข' : '✏️ แก้ไขเว็บ';
    }

    function tryEnterEditMode() {
        if (isAuthenticated) {
            editMode = !editMode;
            updateEditMode();
            return;
        }
        const pass = prompt("กรอกรหัสผ่านผู้พัฒนา:");
        if (pass === DEV_PASSWORD) {
            isAuthenticated = true;
            editMode = true;
            updateEditMode();
        } else if (pass !== null) {
            alert("รหัสผ่านไม่ถูกต้อง");
        }
    }

    window.deleteGame = function(i) {
        if (confirm('ลบเกมนี้?')) {
            siteData.games.splice(i, 1);
            render();
        }
    };

    window.addGame = function() {
        siteData.games.push({ title: "เกมใหม่", description: "คำอธิบาย...", thumb: "N", video: "" });
        render();
    };

    window.deleteUpdate = function(i) {
        if (confirm('ลบอัปเดตนี้?')) {
            siteData.updates.splice(i, 1);
            render();
        }
    };

    window.addUpdate = function() {
        siteData.updates.unshift({ title: "อัปเดตใหม่", date: "วันนี้", text: "เนื้อหาอัปเดต..." });
        render();
    };

    document.getElementById('toggle-edit').onclick = tryEnterEditMode;
    document.getElementById('save-btn').onclick = saveData;

    loadData();
    </script>
</body>
</html>
